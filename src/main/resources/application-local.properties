# Local development profile (run app from IDE, dependencies from Docker compose).
# Activate with: SPRING_PROFILES_ACTIVE=local

# Local runtime is self-contained so IDE/Maven starts cannot accidentally use production .env values.

# Database (from compose.yaml: host 5433 -> container 5432).
spring.datasource.url=jdbc:postgresql://localhost:5433/interhubdev
spring.datasource.username=interhubdev
spring.datasource.password=interhubdev

# Redis (from compose.yaml).
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# MinIO (from compose.yaml).
app.storage.endpoint=http://localhost:9000
app.storage.access-key=minioadmin
app.storage.secret-key=minioadmin
app.storage.bucket-name=documents
app.storage.region=us-east-1

# ClamAV (from compose.yaml).
clamav.enabled=true
clamav.host=localhost
clamav.port=3310

# JWT / bootstrap admin (local-safe defaults).
jwt.secret=local-dev-secret-change-me-min-32-chars
app.admin.email=admin@interhubdev.local
app.admin.password=admin12345
app.admin.first-name=Super
app.admin.last-name=Admin

# Local machine is not behind reverse proxy.
jwt.trust-proxy=false

# In local profile do not enforce secure cookies.
jwt.cookie.secure=false

# Local HTTP cookies must not use SameSite=None without Secure=true; browsers reject them.
jwt.cookie.same-site=Lax

# Vite dev server: localhost/127.0.0.1 and any port (5173, 5174, ...).
jwt.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
jwt.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Local mail uses the same MAIL_* switches as production.
app.email.enabled=${MAIL_ENABLED:true}
app.email.log-only=${MAIL_LOG_ONLY:false}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:true}

# Local diagnostics: show which dependency makes the app unhealthy.
management.endpoint.health.show-details=always
